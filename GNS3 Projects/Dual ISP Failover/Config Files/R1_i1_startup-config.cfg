!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
!
ip dhcp pool VLAN-10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1 
!
ip dhcp pool VLAN-20
 default-router 192.168.20.1 
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
track 10 ip sla 10 reachability
!
track 20 ip sla 20 reachability
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
 ip ospf 1 area 0
!
interface FastEthernet0/0
 ip address 10.10.10.2 255.255.255.252
 ip nat inside
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex full
!
interface GigabitEthernet1/0
 ip address 100.1.1.1 255.255.255.252
 ip nat outside
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 200.1.1.1 255.255.255.252
 ip nat outside
 negotiation auto
!
router ospf 1
 router-id 10.255.255.2
 passive-interface Loopback0
 default-information originate always
!
ip nat inside source route-map ISP-A interface GigabitEthernet1/0 overload
ip nat inside source route-map ISP-A_FAILOVER interface GigabitEthernet2/0 overload
ip nat inside source route-map ISP-B interface GigabitEthernet2/0 overload
ip nat inside source route-map ISP-B_FAILOVER interface GigabitEthernet1/0 overload
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 GigabitEthernet1/0 100.1.1.2 track 10
ip route 0.0.0.0 0.0.0.0 GigabitEthernet2/0 200.1.1.2 track 20
ip route 10.255.255.10 255.255.255.255 GigabitEthernet1/0 100.1.1.2
ip route 10.255.255.20 255.255.255.255 GigabitEthernet2/0 200.1.1.2
!
ip sla 10
 icmp-echo 10.255.255.10 source-interface GigabitEthernet1/0
 threshold 50
 timeout 100
 frequency 5
ip sla schedule 10 life forever start-time now
ip sla 20
 icmp-echo 10.255.255.20 source-interface GigabitEthernet2/0
 threshold 50
 timeout 100
 frequency 5
ip sla schedule 20 life forever start-time now
access-list 10 permit 192.168.10.0 0.0.0.255
access-list 20 permit 192.168.20.0 0.0.0.255
!
route-map ISP-B permit 10
 match ip address 20
 match interface GigabitEthernet2/0
!
route-map ISP-A permit 10
 match ip address 10
 match interface GigabitEthernet1/0
!
route-map ISP-A_FAILOVER permit 10
 match ip address 10
 match interface GigabitEthernet2/0
!
route-map ISP-B_FAILOVER permit 10
 match ip address 20
 match interface GigabitEthernet1/0
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
